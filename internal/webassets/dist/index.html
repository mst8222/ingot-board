<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <meta name="color-scheme" content="light dark" />
    <title>Ingot Board</title>
    <script>
      // 在首屏渲染前定好主题，避免暗色模式下白屏闪一下。
      // 必须同步执行且早于 CSS，所以内联在此而不是等 main.tsx。
      ;(function () {
        try {
          var stored = localStorage.getItem('ingot.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored || (prefersDark ? 'dark' : 'light')
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* localStorage 不可用时保持默认亮色 */
        }
      })()
    </script>

    <link rel="stylesheet" crossorigin href="/assets/index-XZSxXFxK.css">
